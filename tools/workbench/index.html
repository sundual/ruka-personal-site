<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruka Workbench</title>
    <link rel="stylesheet" href="/workbench/workbench.css">
  </head>
  <body>
    <main class="workbench-shell">
      <iframe
        id="site-frame"
        class="site-frame"
        title="Ruka static preview"
        src="http://localhost:8000/index.html"
      ></iframe>

      <aside class="codex-panel" aria-label="Codex session panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Local Codex</p>
            <h1>Session</h1>
          </div>
          <button id="sync-button" type="button">Sync</button>
        </div>

        <div class="mode-row" role="group" aria-label="Codex mode">
          <button id="default-mode" class="mode active" type="button" data-mode="default">Default</button>
          <button id="plan-mode" class="mode" type="button" data-mode="plan">Plan mode</button>
        </div>

        <form id="prompt-form" class="prompt-form">
          <label for="codex-prompt">给 Codex 会话的任务</label>
          <textarea
            id="codex-prompt"
            rows="7"
            placeholder="像普通 Codex 会话一样写：解释这道题并放到物理分区；或者先进入 plan mode 讨论改法。"
          ></textarea>
          <button id="codex-button" type="submit">Send</button>
        </form>

        <details class="task-drawer">
          <summary>会话状态</summary>
          <section class="conversation" aria-label="Conversation state">
            <div id="task-list" class="task-list"></div>
          </section>
        </details>

        <details class="log-drawer">
          <summary>后台日志</summary>
          <pre id="git-status">Not synced yet.</pre>
          <pre id="task-log">No task selected.</pre>
        </details>
      </aside>
    </main>

    <script src="/workbench/workbench.js"></script>
  </body>
</html>
